
name: argus-telemetry
# The eye's first live nerve. Every ~30 minutes: read public meme-market
# telemetry, append one line to data/telemetry.jsonl, commit. No keys,
# no secrets, no third-party actions beyond GitHub's own checkout.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: argus-telemetry
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect one pass
        run: python3 collector.py
      - name: Commit the line
        run: |
          git config user.name "argus-eye"
          git config user.email "argus-eye@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "telemetry $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
