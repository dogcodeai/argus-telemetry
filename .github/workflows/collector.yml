name: argus-telemetry
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: argus-telemetry
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect one pass
        run: python3 collector.py
      - name: Commit the line
        run: |
          git config user.name "argus-eye"
          git config user.email "argus-eye@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "telemetry $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
